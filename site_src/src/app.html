<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Hedge fund backtesting and portfolio creation via live positions based on past performance and risk analysis."
        />
        <meta
            name="keywords"
            content="hedge, hedgesage, fund, backtesting, performance, analysis, investment, trading, portfolio, finance, sharpe, calmar, risk, algorithmic"
        />
        <meta name="author" content="Deniel K" />
        <title>Hedge Fund Backtesting and Portfolio Creation | HedgeSage</title>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div
            style="
                align-self: center;
                margin-left: auto;
                margin-right: auto;
                padding: 1rem;
                width: 100%;
                max-width: 1280px;
            "
        >
            <div
                style="
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    margin-top: 0.75rem;
                "
            >
                <img
                    src="https://denk1k.github.io/hedgesage/logo-transparent.png"
                    alt="HedgeSage Logo"
                    style="width: 17.5rem"
                />
                <div style="margin-top: 0.25rem; margin-left: -10px">
                    <a
                        href="https://github.com/denk1k/hedgesage"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Open HedgeSage on GitHub"
                        style="
                            display: inline-flex;
                            height: 2rem;
                            width: 2rem;
                            align-items: center;
                            justify-content: center;
                            border-radius: 4px;
                            background-color: transparent;
                            transition:
                                background-color 150ms ease-in-out,
                                color 150ms ease-in-out;
                        "
                    >
                        <i data-lucide="github"></i>
                    </a>
                </div>
            </div>
            <h1
                style="
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    color: #0891b2;
                "
            >
                Hedge fund backtesting and portfolio creation via live positions
                based on past performance and risk analysis.
            </h1>
        </div>

        <div style="display: contents">%sveltekit.body%</div>
        <script type="module">
            import {
                createIcons,
                Github,
            } from "https://cdn.jsdelivr.net/npm/lucide@latest/+esm";
            const init = () => createIcons({ icons: { Github } });
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", init);
            } else {
                init();
            }
        </script>
    </body>
</html>
