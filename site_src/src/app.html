<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Hedge fund backtesting and portfolio creation via live positions based on past performance and risk analysis."
        />
        <meta
            name="keywords"
            content="hedge, hedgesage, fund, backtesting, performance, analysis, investment, trading, portfolio, finance, sharpe, calmar, risk, algorithmic"
        />
        <meta name="author" content="Deniel K" />
        <title>Hedge Fund Backtesting and Portfolio Creation | HedgeSage</title>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div class="self-center container mx-auto p-4">
            <div class="flex justify-center items-center mt-3">
                <img
                    class="w-70"
                    src="https://denk1k.github.io/hedgesage/logo-transparent.png"
                    alt="HedgeSage Logo"
                />
                <div class="mt-1" style="margin-left: -10px">
                    <a
                        href="https://github.com/denk1k/hedgesage"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Open HedgeSage on GitHub"
                        class="inline-flex h-8 w-8 items-center justify-center rounded-[4px] bg-transparent hover:bg-white/20 transition-colors"
                    >
                        <i data-lucide="github"></i>
                    </a>
                </div>
            </div>
            <h1 class="flex justify-center items-center text-cyan-600">
                Hedge fund backtesting and portfolio creation via live positions
                based on past performance and risk analysis.
            </h1>
        </div>
        <div style="display: contents">%sveltekit.body%</div>
        <script type="module">
            import {
                createIcons,
                Github,
            } from "https://cdn.jsdelivr.net/npm/lucide@latest/+esm";
            const init = () => createIcons({ icons: { Github } });
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", init);
            } else {
                init();
            }
        </script>
    </body>
</html>
